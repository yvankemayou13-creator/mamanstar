name: Build MamanStar Setup
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build exe
        run: npm run electron:dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: MamanStar-Setup
          path: release/*.exe
